{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Verify OTP | Civic Mapping</title>

    <link rel="stylesheet"
          href="{% static 'css/login.css' %}">

</head>

<body>

<div class="page">

    <div class="brand">

        <div class="brand-icon">
            ✉️
        </div>

        <h1>Verify Your Email</h1>

        <h2>Neighbourhood Civic Portal</h2>

        <p>
            Enter the OTP sent to your registered email address.
        </p>

    </div>


    <div class="portal-card login-card">

        <form method="POST">

            {% csrf_token %}

            <div class="form-group">

                <label for="otp">
                    OTP
                </label>

                <input
                    type="text"
                    id="otp"
                    name="otp"
                    placeholder="Enter 6-digit OTP"
                    maxlength="6"
                    required
                >

            </div>


            <button type="submit" class="portal-btn">

                <span>Login to User Portal</span>

                <span>→</span>

            </button>

        </form>


        {% if error %}

        <p class="login-error">
            {{ error }}
        </p>

        {% endif %}

    </div>

</div>

</body>

</html>
